name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      skip_signing:
        description: 'Bỏ qua signing (Unsigned IPA cho TrollStore / Sideloadly / Scarlet / ESign)'
        type: boolean
        required: false
        default: true
      release_tag:
        description: 'Tag cho GitHub Release'
        type: string
        required: false
        default: 'v1.0-berry'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA (Xcode)
    runs-on: macos-15

    steps:
      - name: Checkout Repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS Assets
        run: |
          git lfs pull

      - name: Check Xcode Version
        run: |
          xcodebuild -version

      - name: Setup Apple Certificate if provided
        id: setup_cert
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: 'build_temp_keychain'
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ "${{ github.event.inputs.skip_signing }}" != "true" ]; then
            echo "has_cert=true" >> $GITHUB_OUTPUT
            echo "Importing Apple Certificate..."
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-key-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"

            if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
              echo "Importing Provisioning Profile..."
              mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
              echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/embedded.mobileprovision"
            fi
          else
            echo "has_cert=false" >> $GITHUB_OUTPUT
            echo "Mode: Unsigned Build (No certificate or skip_signing is true)"
          fi

      - name: Compile iPhone ARM64 app
        run: |
          set -euo pipefail
          mkdir -p build/DerivedData
          chmod -R u+rwx .
          chmod -R +x Il2CppOutputProject/IL2CPP/build 2>/dev/null || true
          if [ "${{ steps.setup_cert.outputs.has_cert }}" = "true" ]; then
            echo "Compiling with Code Signing..."
            xcodebuild build \
              -project Unity-iPhone.xcodeproj \
              -scheme Unity-iPhone \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
              -jobs 3 \
              COMPILER_INDEX_STORE_ENABLE=NO
          else
            echo "Compiling Unsigned..."
            xcodebuild build \
              -project Unity-iPhone.xcodeproj \
              -scheme Unity-iPhone \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
              -jobs 3 \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              COMPILER_INDEX_STORE_ENABLE=NO
          fi

      - name: Validate and package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Không tìm thấy file .app sau khi build!"
            exit 1
          fi
          echo "Tìm thấy .app: $APP_PATH"
          
          mkdir -p build/Payload output
          ditto "$APP_PATH" "build/Payload/$(basename "$APP_PATH")"
          (cd build && zip -qry "$GITHUB_WORKSPACE/output/NRO-Berry-iOS.ipa" Payload)
          
          echo "Kích thước IPA:"
          ls -lh output/NRO-Berry-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRO_Berry_iOS_IPA
          path: output/NRO-Berry-iOS.ipa
          retention-days: 14

      - name: Create / Update GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: output/NRO-Berry-iOS.ipa
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0-berry' }}
          name: "NRO Berry iOS IPA (${{ github.event.inputs.release_tag || 'v1.0-berry' }})"
          body: |
            ## NRO Berry iOS IPA Release
            - Build tự động từ GitHub Actions
            - Cài đặt hỗ trợ: **TrollStore, Scarlet, Sideloadly, AltStore, ESign**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
